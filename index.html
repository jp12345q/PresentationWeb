<!doctype html>
<html lang="fil">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101d2b">
  <meta name="description" content="Isang 15-slide na presentasyong pang-web tungkol sa Kautusan ng Langit at kasaysayan sa pagpapalaganap ng TAO, batay sa Kabanata 7, pahina 115–131 ng aklat.">
  <title>Ang Kautusan ng Langit at ang Pagpapalaganap ng TAO — 15 Slides</title>
  <link rel="stylesheet" href="styles.css">
  <script src="slides.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar" aria-label="Pamahalaan ng presentasyon">
      <div class="brand"><span class="brand-emblem" aria-hidden="true">道</span><div><strong>ANG LANDAS NG TAO</strong><small>Presentation • Kabanata 7</small></div></div>
      <div class="topbar-actions">
        <button id="overviewBtn" class="action-btn" title="Tingnan lahat ng slides (O)" aria-label="Tingnan lahat ng slides">▦ <span>Mga slide</span></button>
        <button id="notesBtn" class="action-btn" title="Tala ng tagapagsalita (N)" aria-label="Tala ng tagapagsalita">▤ <span>Notes</span></button>
        <button id="printBtn" class="action-btn" title="I-print o i-save bilang PDF (P)" aria-label="Print o PDF">⎙ <span>PDF</span></button>
        <button id="fullscreenBtn" class="action-btn" title="Buong screen (F)" aria-label="Buong screen">⛶ <span>Fullscreen</span></button>
      </div>
    </header>

    <main class="stage" id="stage" aria-label="15-slide presentation">
      <div class="deck" id="deck" aria-live="polite"></div>
    </main>

    <footer class="toolbar" aria-label="Navigasyon ng slides">
      <div class="toolbar-left"><span class="key-hint">←</span><span class="key-hint">→</span><span class="hint-text">Gamitin ang arrow keys</span></div>
      <div class="toolbar-middle"><button id="previousBtn" class="nav-btn" title="Nakaraang slide (←)" aria-label="Nakaraang slide">←</button><button id="nextBtn" class="nav-btn nav-btn-primary" title="Susunod na slide (→)" aria-label="Susunod na slide">→</button><span id="slideCount" class="slide-count" aria-live="off">01 / 15</span></div>
      <div class="toolbar-right"><span id="sectionName" class="section-name">Panimula</span></div>
      <div id="progressTrack" class="progress-track" role="progressbar" aria-label="Progreso ng presentasyon" aria-valuemin="1" aria-valuemax="15" aria-valuenow="1"><div id="progressFill" class="progress-fill"></div></div>
    </footer>

    <div class="overlay" id="overviewOverlay" hidden role="dialog" aria-modal="true" aria-labelledby="overviewTitle">
      <div class="overlay-panel overview-panel">
        <div class="panel-heading"><div><small>LAHAT NG SLIDES</small><h2 id="overviewTitle">Pumili ng slide</h2></div><button type="button" class="close-btn" id="closeOverview" aria-label="Isara">×</button></div>
        <div id="overviewGrid" class="overview-grid"></div>
      </div>
    </div>

    <div class="overlay" id="notesOverlay" hidden role="dialog" aria-modal="true" aria-labelledby="notesTitle">
      <div class="overlay-panel notes-panel">
        <div class="panel-heading"><div><small>GABAY SA PAGPAPALIWANAG</small><h2 id="notesTitle">Speaker notes</h2></div><button type="button" class="close-btn" id="closeNotes" aria-label="Isara">×</button></div>
        <div id="notesContent" class="notes-content"></div>
        <div class="notes-tip">Paalala: Mga buod at sariling pananalita ang nasa slides; ang mga espirituwal na pahayag ay inilalahad bilang mga turo ng aklat.</div>
      </div>
    </div>
  </div>
  <noscript><div class="noscript">Paganahin ang JavaScript sa browser upang makita ang 15-slide na presentasyon.</div></noscript>
</body>
</html>
